# cargo-about: licenses of the crates compiled into the packages (tools/third-party-licenses.sh).
# For "A OR B" crates the first accepted license in this list is used.
accepted = [
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "CC0-1.0",
    "BSL-1.0",
    "Unicode-3.0",
    "Apache-2.0",
    "MPL-2.0",
    "LGPL-2.1",
    "GPL-3.0-only",
]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "riscv64gc-unknown-linux-gnu",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true

# CableBox's own crates (publish = false) aren't third-party.
[private]
ignore = true
