[workspace]
resolver = "3"
members = ["crates/tvh", "crates/player", "crates/input", "crates/sysctl", "crates/app"]

[workspace.package]
version = "0.1.12"
edition = "2021"
rust-version = "1.89"
license = "GPL-2.0-or-later"
publish = false

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "query", "rustls-no-provider"] }
# ring rather than aws-lc: it cross-compiles to arm64/riscv64 with just the target gcc.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tracing = "0.1"
