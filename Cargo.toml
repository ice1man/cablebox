[workspace]
resolver = "3"
members = ["crates/tvh", "crates/player", "crates/input", "crates/sysctl", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "GPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "query"] }
tracing = "0.1"
