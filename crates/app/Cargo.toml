[package]
name = "cablebox"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Retro cable-box shell for Tvheadend"

[dependencies]
tvh = { path = "../tvh" }
player = { path = "../player" }
slint = { version = "=1.14.1", default-features = false, features = ["std", "compat-1-2", "renderer-femtovg"] }
anyhow.workspace = true
serde.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
input = { path = "../input" }
sysctl = { path = "../sysctl" }
toml = "0.8"
directories = "6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[build-dependencies]
slint-build = "=1.14.1"

[features]
default = ["winit"]
# Windowed backend for desktop development. Not shipped in packages.
winit = ["slint/backend-winit"]
# Render straight to KMS/DRM with libinput (production session). Needs libinput-dev, libgbm-dev, libudev-dev.
kms = ["slint/backend-linuxkms-noseat"]

[package.metadata.deb]
name = "cablebox"
maintainer = "ice <ice@icecubelabs.xyz>"
section = "video"
priority = "optional"
# Packages only get the KMS backend; the windowed (winit) backend is for development.
default-features = false
features = ["kms"]
depends = "$auto, packagekit, network-manager, polkitd | policykit-1, adduser"
recommends = "v4l-utils, fonts-dejavu-core"
extended-description = """\
Boots straight into a full-screen, remote-controlled TV interface styled like a classic \
cable box: live TV with channel-number entry, a grid guide, DVR recordings and \
favorites from a Tvheadend server, plus on-screen Wi-Fi setup and system updates."""
maintainer-scripts = "../../packaging/debian/"
assets = [
    ["target/release/cablebox", "usr/bin/", "755"],
    ["../../packaging/cablebox.service", "usr/lib/systemd/system/", "644"],
    ["../../packaging/cablebox-cec.service", "usr/lib/systemd/system/", "644"],
    ["../../packaging/50-cablebox.rules", "usr/share/polkit-1/rules.d/", "644"],
    # Repo signing keys. Shipping them lets a key rotation reach boxes through normal updates.
    ["../../packaging/cablebox-archive-keyring.gpg", "usr/share/keyrings/cablebox.gpg", "644"],
    ["../../README.md", "usr/share/doc/cablebox/", "644"],
]

# Cross builds can't run dpkg-shlibdeps against the target's libraries, so list them
# (same as what $auto finds on amd64). Used by tools/build-cross.sh.
[package.metadata.deb.variants.arm64]
name = "cablebox"
depends = "libc6 (>= 2.39), libgbm1 (>= 17.1.0~rc2), libinput10 (>= 1.7.2), libmpv2 (>= 0.29), libudev1 (>= 183), libxkbcommon0 (>= 0.5.0), packagekit, network-manager, polkitd | policykit-1, adduser"

[package.metadata.deb.variants.riscv64]
name = "cablebox"
depends = "libc6 (>= 2.39), libgbm1 (>= 17.1.0~rc2), libinput10 (>= 1.7.2), libmpv2 (>= 0.29), libudev1 (>= 183), libxkbcommon0 (>= 0.5.0), packagekit, network-manager, polkitd | policykit-1, adduser"
